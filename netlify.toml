"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Functions (Netlify Functions v2: plain .mjs, `export default async (req,
# context) => Response`, routed by their own `config.path`):
#
#   netlify/functions/scan.mjs       /api/scan        "See what AI sees on your site"
#   netlify/functions/assistant.mjs  /api/assistant   the scoping assistant (GET: status)
#   netlify/functions/mcp.mjs        /mcp             the MCP endpoint for AI agents
#
# They live outside dist/, so their source never ships as a static file.
# Secrets (ANTHROPIC_API_KEY) are set in the Netlify UI with the Functions
# scope, never here: variables in this file don't reach functions at all.
# Headers on a function's response are set in its code; the [[headers]]
# below apply only to static files.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Built files a function reads at runtime. Functions are bundled after the
# build command, so dist/ exists by then; anything read with fs and not
# listed here is missing in production (ENOENT) while working locally.
# The MCP endpoint answers from the site's own words, with sources; the
# assistant knows what the firm offers from the same text.
[functions.mcp]
  included_files = ["dist/search-index.json", "dist/llms-full.txt"]

[functions.assistant]
  included_files = ["dist/llms-full.txt"]

# Vite's assets are hashed and can be cached forever. The fonts never
# change name, and a redeploy that changes one ships a new filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

    # Content-Security-Policy.
    #
    # This site is static apart from three of its own functions, has no
    # login and no third-party script, which means the policy can be
    # genuinely strict rather than a placeholder with 'unsafe-inline'
    # everywhere. Each source is deliberate:
    #
    #   default-src 'self'   Nothing loads from anywhere else. There is no
    #                        CDN, no font host, no analytics, no embed.
    #   script-src 'self'    No 'unsafe-inline', no 'unsafe-eval', no hashes.
    #                        Keep it that way: one inline script forces
    #                        either 'unsafe-inline', which disables the
    #                        protection for every page, or a hash that goes
    #                        stale the moment the markup is edited. The
    #                        console demo's transcript is a JSON <script>,
    #                        which is DATA and is not executed, so it does
    #                        not need a hash.
    #   style-src            'unsafe-inline' is required and is not a hole
    #                        worth closing: the markup uses style="--i:2" to
    #                        stagger reveals, and style-src covers attributes
    #                        as well as elements. There is no session token
    #                        on this origin for style injection to reach.
    #   frame-ancestors      No reason for this site to be framed by anyone.
    #   media-src 'none'     There's no video or audio on the site at all.
    #   connect-src 'self'   The live readouts (Machine View, Ask, the
    #                        headers panel) fetch this site's own files, and
    #                        the scanner and the assistant call this site's
    #                        own functions (/api/scan, /api/assistant).
    #                        Nothing else: the functions reach outside, the
    #                        browser never does.
    #   form-action 'self'   One form: the intake form on /start/, posted to
    #                        this origin (/start/sent/) for Netlify Forms to
    #                        receive. It was 'none' while the site had no
    #                        form; a form that posts anywhere else has to
    #                        change this line, which is the point.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'none'; connect-src 'self'; frame-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# Canonical host. The build's every canonical, og:url and sitemap entry names
# adjltechnology.com, but Netlify keeps the project reachable at its own
# *.netlify.app hostname too, and that hostname was answering 200 — the same
# eight pages live under two origins, which is duplicate content a canonical
# tag only asks a crawler to forgive rather than preventing outright. Send it
# to the real origin instead.
#
# Deploy previews are unaffected: they answer on <deploy-id>--adjl-technology
# .netlify.app, which this exact-host rule does not match.
[[redirects]]
  from = "https://adjl-technology.netlify.app/*"
  to = "https://adjltechnology.com/:splat"
  status = 301
  force = true

# Trailing-slash canonical: /work and /work/ must not both be live pages.
# Every route has one, including the case pages, so no URL answers twice.
[[redirects]]
  from = "/services"
  to = "/services/"
  status = 301

